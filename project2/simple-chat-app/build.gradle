plugins {
    id 'java'
}

group = 'dev.ioannikas'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
    systemProperty 'total', System.getProperty('total', 'true')
    systemProperty 'causal', System.getProperty('causal', 'true')
    systemProperty 'crashIndex', System.getProperty('crashIndex', '1')
}

tasks.named('jar') {
    enabled=false
    dependsOn('ChatApp', 'GMS')
}

tasks.register('ChatApp', Jar) {
    archiveFileName = 'ChatApp.jar'
    manifest {
        attributes 'Main-Class': 'dev.ioannikas.chatapp.ChatApp'
    }
    from sourceSets.main.output
}

tasks.register('GMS', Jar) {
    archiveFileName = 'GMS.jar'
    manifest {
        attributes 'Main-Class': 'dev.ioannikas.group.gms.GMS'
    }
    from sourceSets.main.output
}