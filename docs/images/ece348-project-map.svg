<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ECE348 distributed systems project map</title>
  <desc id="desc">Four assignment cards show the progression from UDP request-reply to group communication, cached network file service, and a SimpleScript distributed runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.subtitle{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.num{font:800 20px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.head{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.body{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.tag{font:800 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.08em}.arrow{stroke:#67e8f9;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.75}.dot{fill:#67e8f9}
    </style>
  </defs>
  <rect width="1200" height="430" rx="30" fill="url(#bg)"/>
  <circle cx="100" cy="60" r="170" fill="#0891b2" opacity="0.16"/>
  <circle cx="1110" cy="380" r="210" fill="#14b8a6" opacity="0.14"/>
  <text x="60" y="70" class="title">ECE348 — Distributed Systems</text>
  <text x="60" y="100" class="subtitle">A four-assignment progression from protocol semantics to distributed runtimes</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="240" height="200" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="95" cy="185" r="18" fill="#67e8f9"/><text x="88" y="192" class="num">1</text>
    <text x="125" y="190" class="head">Request/reply</text>
    <text x="85" y="230" class="body">UDP protocol library</text>
    <text x="85" y="254" class="body">at-most-once semantics</text>
    <text x="85" y="278" class="body">server reboot recovery</text>
    <text x="85" y="302" class="body">multi-server load balance</text>
    <rect x="85" y="320" width="84" height="22" rx="11" fill="#cffafe"/><text x="103" y="335" class="tag" fill="#0e7490">C + PY</text>
  </g>

  <path class="arrow" d="M315 250 C335 250 345 250 365 250"/><path class="arrow" d="M355 240 L365 250 L355 260"/>

  <g filter="url(#shadow)">
    <rect x="380" y="150" width="240" height="200" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="415" cy="185" r="18" fill="#a7f3d0"/><text x="408" y="192" class="num">2</text>
    <text x="445" y="190" class="head">Group multicast</text>
    <text x="405" y="230" class="body">GMS membership service</text>
    <text x="405" y="254" class="body">BM / URM / TRM layers</text>
    <text x="405" y="278" class="body">causal-total delivery</text>
    <text x="405" y="302" class="body">chat app + crash tests</text>
    <rect x="405" y="320" width="72" height="22" rx="11" fill="#dcfce7"/><text x="423" y="335" class="tag" fill="#047857">JAVA</text>
  </g>

  <path class="arrow" d="M635 250 C655 250 665 250 685 250"/><path class="arrow" d="M675 240 L685 250 L675 260"/>

  <g filter="url(#shadow)">
    <rect x="700" y="150" width="240" height="200" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="735" cy="185" r="18" fill="#fde68a"/><text x="728" y="192" class="num">3</text>
    <text x="765" y="190" class="head">Network file system</text>
    <text x="725" y="230" class="body">remote file API over UDP</text>
    <text x="725" y="254" class="body">open/read/write/truncate</text>
    <text x="725" y="278" class="body">LRU client block cache</text>
    <text x="725" y="302" class="body">freshness validation</text>
    <rect x="725" y="320" width="50" height="22" rx="11" fill="#fef3c7"/><text x="742" y="335" class="tag" fill="#b45309">C</text>
  </g>

  <path class="arrow" d="M955 250 C975 250 985 250 1005 250"/><path class="arrow" d="M995 240 L1005 250 L995 260"/>

  <g filter="url(#shadow)">
    <rect x="1020" y="150" width="120" height="200" rx="22" fill="#0f766e" stroke="#5eead4"/>
    <circle cx="1050" cy="185" r="18" fill="#ccfbf1"/><text x="1043" y="192" class="num">4</text>
    <text x="1040" y="225" class="head">Simple</text>
    <text x="1040" y="250" class="head">Script</text>
    <text x="1040" y="275" class="body" fill="#ecfeff">runtime</text>
    <text x="1040" y="299" class="body" fill="#ecfeff">migration</text>
    <text x="1040" y="323" class="body" fill="#ecfeff">balancing</text>
  </g>
  <text x="60" y="390" class="subtitle">Each assignment adds a new distributed-systems concern: semantics, ordering, caching, mobility, and coordination.</text>
</svg>
