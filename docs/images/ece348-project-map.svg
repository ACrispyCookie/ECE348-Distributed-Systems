<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">ECE348 distributed systems project map</title>
  <desc id="desc">Four assignment cards summarize the progression from request-reply protocols to group communication, network file systems, and a SimpleScript runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="58%" stop-color="#111827"/><stop offset="100%" stop-color="#155e75"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:800 36px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.subtitle{font:500 17px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.num{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.head{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.body{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.tag{font:800 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.08em}.arrow{stroke:#67e8f9;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.75}.card{fill:url(#card);stroke:#334155;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="96" cy="70" r="180" fill="#0891b2" opacity=".16"/>
  <circle cx="1095" cy="420" r="240" fill="#14b8a6" opacity=".14"/>
  <text x="60" y="72" class="title">ECE348 — Distributed Systems</text>
  <text x="60" y="106" class="subtitle">A four-assignment progression from protocol semantics to distributed runtimes</text>

  <g filter="url(#shadow)">
    <rect x="60" y="165" width="235" height="210" rx="22" class="card"/>
    <circle cx="96" cy="200" r="18" fill="#67e8f9"/><text x="96" y="207" text-anchor="middle" class="num">1</text>
    <text x="126" y="204" class="head">Request/reply</text>
    <text x="90" y="244" class="body">UDP protocol library</text>
    <text x="90" y="268" class="body">at-most-once semantics</text>
    <text x="90" y="292" class="body">server reboot recovery</text>
    <text x="90" y="316" class="body">multi-server load balance</text>
    <rect x="113" y="342" width="88" height="24" rx="12" fill="#cffafe"/><text x="157" y="358" text-anchor="middle" class="tag" fill="#0e7490">C + PY</text>
  </g>
  <path class="arrow" d="M315 270 L365 270"/><path class="arrow" d="M355 260 L365 270 L355 280"/>

  <g filter="url(#shadow)">
    <rect x="385" y="165" width="235" height="210" rx="22" class="card"/>
    <circle cx="421" cy="200" r="18" fill="#a7f3d0"/><text x="421" y="207" text-anchor="middle" class="num">2</text>
    <text x="451" y="204" class="head">Group multicast</text>
    <text x="415" y="244" class="body">GMS membership service</text>
    <text x="415" y="268" class="body">BM / URM / TRM layers</text>
    <text x="415" y="292" class="body">causal-total delivery</text>
    <text x="415" y="316" class="body">chat app + crash tests</text>
    <rect x="466" y="342" width="74" height="24" rx="12" fill="#dcfce7"/><text x="503" y="358" text-anchor="middle" class="tag" fill="#047857">JAVA</text>
  </g>
  <path class="arrow" d="M640 270 L690 270"/><path class="arrow" d="M680 260 L690 270 L680 280"/>

  <g filter="url(#shadow)">
    <rect x="710" y="165" width="235" height="210" rx="22" class="card"/>
    <circle cx="746" cy="200" r="18" fill="#fde68a"/><text x="746" y="207" text-anchor="middle" class="num">3</text>
    <text x="776" y="196" class="head">Network file</text>
    <text x="776" y="220" class="head">system</text>
    <text x="740" y="254" class="body">remote file API over UDP</text>
    <text x="740" y="278" class="body">read / write / truncate</text>
    <text x="740" y="302" class="body">LRU client block cache</text>
    <text x="740" y="326" class="body">freshness validation</text>
    <rect x="802" y="342" width="52" height="24" rx="12" fill="#fef3c7"/><text x="828" y="358" text-anchor="middle" class="tag" fill="#b45309">C</text>
  </g>
  <path class="arrow" d="M965 270 L1015 270"/><path class="arrow" d="M1005 260 L1015 270 L1005 280"/>

  <g filter="url(#shadow)">
    <rect x="1035" y="165" width="105" height="210" rx="22" fill="#0f766e" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="1088" cy="200" r="18" fill="#ccfbf1"/><text x="1088" y="207" text-anchor="middle" class="num">4</text>
    <text x="1088" y="240" text-anchor="middle" class="head">Simple</text>
    <text x="1088" y="264" text-anchor="middle" class="head">Script</text>
    <text x="1088" y="298" text-anchor="middle" class="body" fill="#ecfeff">runtime</text>
    <text x="1088" y="322" text-anchor="middle" class="body" fill="#ecfeff">migration</text>
    <text x="1088" y="346" text-anchor="middle" class="body" fill="#ecfeff">balancing</text>
  </g>
  <text x="60" y="435" class="subtitle">Each assignment adds a new distributed-systems concern: semantics, ordering, caching, mobility, and coordination.</text>
</svg>
