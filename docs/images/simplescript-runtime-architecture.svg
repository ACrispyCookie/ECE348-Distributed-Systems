<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">SimpleScript distributed runtime architecture</title>
  <desc id="desc">Architecture diagram for Assignment 4 showing CLI commands, scheduler queues, interpreter state, tuple space, networking, discovery, migration, load balancing, shutdown, and peer runtime nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="58%" stop-color="#111827"/><stop offset="100%" stop-color="#134e4a"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#5eead4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .title{font:800 32px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.sub{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.box-title{font:800 19px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.box-text{font:500 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}.tiny{font:800 10px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.06em}.chip{font:700 13px Inter,Segoe UI,Arial,sans-serif}.flow{stroke:#67e8f9;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}.flow2{stroke:#a7f3d0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}.muted{stroke:#64748b;stroke-width:2;stroke-dasharray:6 8;fill:none}.node{fill:#0f172a;stroke:#334155;stroke-width:1.5}.pill{fill:#164e63;stroke:#22d3ee;stroke-width:1}.small-title{font:800 16px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
    </style>
  </defs>
  <rect width="1200" height="820" rx="30" fill="url(#bg)"/>
  <circle cx="95" cy="700" r="240" fill="#0891b2" opacity=".13"/>
  <circle cx="1110" cy="110" r="230" fill="#14b8a6" opacity=".12"/>
  <text x="60" y="62" class="title">Assignment 4 — SimpleScript distributed runtime</text>
  <text x="60" y="92" class="sub">Mobile-code execution with tuple-space communication, migration, balancing, and shutdown handoff</text>

  <g filter="url(#shadow)">
    <rect x="60" y="125" width="1080" height="570" rx="26" fill="url(#panel)" stroke="#334155"/>
    <text x="92" y="166" class="box-title">Local runtime environment</text>
    <text x="92" y="190" class="box-text">One process hosts SimpleScript threads, a tuple space, a scheduler, and a network endpoint.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="100" y="245" width="215" height="130" rx="20" class="node"/>
    <text x="130" y="285" class="box-title">CLI commands</text>
    <text x="130" y="314" class="box-text">run · list · kill</text>
    <text x="130" y="338" class="box-text">connect · migrate</text>
    <text x="130" y="362" class="box-text">tuples · shutdown</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="405" y="225" width="320" height="175" rx="20" class="node"/>
    <text x="440" y="265" class="box-title">Scheduler</text>
    <text x="440" y="292" class="box-text">cooperatively steps each thread</text>
    <rect x="440" y="315" width="83" height="26" rx="13" fill="#1d4ed8"/><text x="457" y="333" class="chip" fill="#dbeafe">active</text>
    <rect x="533" y="315" width="95" height="26" rx="13" fill="#7c2d12"/><text x="548" y="333" class="chip" fill="#ffedd5">sleeping</text>
    <rect x="638" y="315" width="76" height="26" rx="13" fill="#581c87"/><text x="652" y="333" class="chip" fill="#f3e8ff">waiting</text>
    <text x="440" y="366" class="box-text">migrates when load difference ≥ 2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="100" y="465" width="290" height="150" rx="20" class="node"/>
    <text x="130" y="505" class="box-title">Parser + interpreter</text>
    <text x="130" y="535" class="box-text">#SIMPLESCRIPT validation</text>
    <text x="130" y="559" class="box-text">arithmetic, branches, sleep, PRN</text>
    <text x="130" y="583" class="box-text">ThreadState stores pc, vars, wait state</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="465" width="295" height="150" rx="20" class="node"/>
    <text x="485" y="505" class="box-title">Distributed tuple space</text>
    <text x="485" y="535" class="box-text">OUT publishes concrete tuples</text>
    <text x="485" y="559" class="box-text">RD reads without consuming</text>
    <text x="485" y="583" class="box-text">IN consumes via cancel/consume ACKs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="815" y="245" width="265" height="370" rx="20" class="node"/>
    <text x="845" y="285" class="box-title">Network layer</text>
    <text x="845" y="315" class="box-text">TCP runtime messages</text>
    <text x="845" y="339" class="box-text">UDP multicast discovery</text>
    <text x="845" y="363" class="box-text">manual connect fallback</text>
    <rect x="845" y="405" width="190" height="28" rx="14" class="pill"/><text x="861" y="424" class="chip" fill="#ecfeff">TupleIn / TupleOut</text>
    <rect x="845" y="443" width="190" height="28" rx="14" class="pill"/><text x="861" y="462" class="chip" fill="#ecfeff">ThreadMigrate</text>
    <rect x="845" y="481" width="190" height="28" rx="14" class="pill"/><text x="861" y="500" class="chip" fill="#ecfeff">LoadStatus</text>
    <rect x="845" y="519" width="190" height="28" rx="14" class="pill"/><text x="861" y="538" class="chip" fill="#ecfeff">ShutdownPrepare</text>
  </g>

  <path class="flow" d="M315 310 L405 310"/><path class="flow" d="M395 300 L405 310 L395 320"/>
  <path class="flow" d="M530 400 C500 430 435 458 390 525"/><path class="flow" d="M403 520 L390 525 L397 512"/>
  <path class="flow" d="M600 400 L600 465"/><path class="flow" d="M590 455 L600 465 L610 455"/>
  <path class="flow" d="M750 540 L815 540"/><path class="flow" d="M805 530 L815 540 L805 550"/>
  <path class="flow2" d="M815 360 C780 350 760 335 725 322"/><path class="flow2" d="M735 314 L725 322 L737 334"/>

  <g>
    <rect x="750" y="720" width="150" height="58" rx="18" fill="#111827" stroke="#64748b"/>
    <text x="780" y="746" class="small-title">Peer A</text>
    <text x="780" y="770" class="box-text">tuples + state</text>
    <rect x="910" y="720" width="230" height="58" rx="18" fill="#042f2e" stroke="#2dd4bf"/>
    <text x="938" y="746" class="small-title">Peer runtimes</text>
    <text x="938" y="770" class="box-text">same architecture on peers</text>
  </g>
  <path class="muted" d="M955 615 C970 650 1010 680 1030 720"/>
  <path class="muted" d="M910 615 C890 650 855 680 830 720"/>

  <g>
    <rect x="100" y="720" width="585" height="58" rx="24" fill="url(#accent)" opacity=".92"/>
    <text x="128" y="744" class="tiny" fill="#042f2e">MIGRATION PRESERVES THREAD ID, PROGRAM COUNTER, VARIABLES,</text>
    <text x="128" y="764" class="tiny" fill="#042f2e">AND SLEEPING OR BLOCKED TUPLE-REQUEST STATE</text>
  </g>
</svg>
